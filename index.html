<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANK Bank ATM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- frame 1 -->
    <div class="loading_main" id="loading_main">
        <div class="loading_main_icon" id="loading_main_icon">💻</div>
        <div class="loading_main_text" id="loading_main_text">Use desktop for <br> better experince</div>
    </div>

    <!-- frame 2  -->
    <div class="welcome_div" id="welcome_div">
        <h1>ANK Bank</h1>
        <h3>Secure • Fast</h3>
    </div>

    <!-- frame 3 -->
     <form class="form_main" id="form_main">
        <h1 id="form_heading">Create Your Account</h1>

        <p>Full Name</p>
        <input type="text" id="form_full_name">

        <p>Account Number</p>
        <input type="text" id="form_acc_number" disabled>

        <p>Initial Balance</p>
        <input type="number" id="form_bal_amount" value="5000">

        <p>Security PIN</p>
        <input type="password" id="form_pin" maxlength="4">

        <p>Confirm PIN</p>
        <input type="text" id="form_pin_con">

        <button id="form_submit_btn">Create Account</button>
    </form>

    <!-- frame 4 -->
    <section class="acc_sum_view" id="acc_sum_view">
        <!-- <h2>Account Created Successfully</h2>
        <p>Account Name : ${nameInput.value}</p>
        <p>Account No. : ${accInput.value}</p>
        <p>PIN : ${passInput.value}</p>
        <h3>Please rember your account no.</h3> -->
    </section>

    <!-- frame 5 -->
    <main class="real_main" id="real_main">
        <section class="main_section" id="main_section">

        </section>

        <section class="sub_section" id="sub_section">
            
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
