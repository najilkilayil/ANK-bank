<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frame 3</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    
    <form class="form_main" id="form_main" style="display: flex;">
        <h1 id="form_heading">Fill Your Account</h1>

        <p>Full Name</p>
        <input type="text" id="form_full_name">

        <p>Account Number</p>
        <input type="text" id="form_acc_number" disabled>

        <p>Balance</p>
        <input type="number" id="form_bal_amount" value="5000">

        <p>PIN</p>
        <input type="password" id="form_pin" maxlength="4">

        <p>Conform PIN</p>
        <input type="text" id="form_pin_con">

        <button id="form_submit_btn">Submit</button>
    </form>
</body>
</html>
